name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install root dependencies
        run: yarn install --immutable

      - name: Test engage-core (100% coverage required)
        working-directory: engage-core
        run: |
          npm run test:coverage -- \
            --coverageThreshold='{"global":{"lines":100,"branches":100,"functions":100,"statements":100}}'

      - name: Build engage-core (required by src tests)
        working-directory: engage-core
        run: npm run build

      - name: Test src (100% coverage required)
        run: |
          yarn test \
            --coverage \
            --coverageThreshold='{"global":{"lines":100,"branches":100,"functions":100,"statements":100}}'

  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2') && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@recurly'

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install root dependencies
        run: yarn install --immutable

      - name: Build engage-core
        working-directory: engage-core
        run: npm run build

      - name: Publish engage-core
        continue-on-error: true
        working-directory: engage-core
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build root library
        run: yarn prepare

      - name: Publish root library
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Detect release
        id: rel
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.rel.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          generate_release_notes: true
