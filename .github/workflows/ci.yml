name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install root dependencies
        run: yarn install --immutable

      - name: Test engage-core (100% coverage required)
        working-directory: engage-core
        run: |
          npm run test:coverage -- \
            --coverageThreshold='{"global":{"lines":100,"branches":100,"functions":100,"statements":100}}'

      - name: Build engage-core (required by src tests)
        working-directory: engage-core
        run: npm run build

      - name: Test src (100% coverage required)
        run: |
          yarn test \
            --coverage \
            --coverageThreshold='{"global":{"lines":100,"branches":100,"functions":100,"statements":100}}'

